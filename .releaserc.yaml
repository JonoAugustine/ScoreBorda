branches:
  - master
plugins:
  - - '@semantic-release/commit-analyzer'
    - preset: conventionalcommits
  - - '@semantic-release/release-notes-generator'
    - preset: conventionalcommits
  - - '@semantic-release/changelog'
    - changelogTitle: ScoreBorda ChangeLog
  # Bumps the `version` field in package.json so it tracks the tags. This package is
  # private and never published, so `npmPublish: false` also means no NPM_TOKEN is
  # needed. Must stay ahead of `@semantic-release/git` so the bump is committed.
  - - '@semantic-release/npm'
    - npmPublish: false
  - '@semantic-release/github'
  - - '@semantic-release/git'
    - assets:
        - package.json
        - CHANGELOG.md
      message: |-
        chore(release): ${nextRelease.version} [skip ci]

        ${nextRelease.notes}
