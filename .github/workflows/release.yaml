name: Release
on:
  push:
    branches:
      - master # or main

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 26 is the current line, not LTS until Oct 2026 — revert to "lts/*" (24.x, Krypton)
          # if the release job needs the conservative option.
          node-version: "26.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      # `pnpm audit signatures` is an npm-only subcommand: pnpm ignores the argument and
      # runs a plain audit, so this step failed on any advisory in the dev tree and
      # semantic-release never ran. Gate on production advisories instead.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      # Never tag a release that does not compile. Lint and format are deliberately not
      # gated here yet: both fail on master today (see issues #17 and #18).
      - name: Build
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release
